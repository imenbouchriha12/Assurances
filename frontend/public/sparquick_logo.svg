<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Logo SPARQuick">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" fill="#FFFFFF"/>
  <!-- bouclier -->
  <path d="M110 24 L184 50 V108 C184 150 152 178 110 196 C68 178 36 150 36 108 V50 Z" fill="url(#g)"/>
  <!-- traces de vitesse -->
  <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round">
    <line x1="52" y1="92" x2="76" y2="92"/>
    <line x1="58" y1="112" x2="84" y2="112"/>
    <line x1="52" y1="132" x2="74" y2="132"/>
  </g>
  <!-- eclair -->
  <polygon points="126,48 82,118 107,118 94,172 142,96 116,96" fill="url(#b)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <!-- noeuds du graphe aux extremites -->
  <circle cx="126" cy="48" r="9" fill="#5EEAD4" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="94" cy="172" r="9" fill="#5EEAD4" stroke="#FFFFFF" stroke-width="3"/>
  <!-- texte -->
  <text x="212" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#1E3A8A">SPAR<tspan fill="#0F766E">Quick</tspan></text>
  <text x="216" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="1.5" fill="#475569">Posez la question, le graphe répond.</text>
</svg>
